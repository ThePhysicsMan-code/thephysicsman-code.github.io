<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stocky - Stock Market Prediction Platform  by Aarav Kumar</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-950 text-gray-100 font-sans antialiased min-h-screen flex flex-col">

    <nav class="border-b border-gray-800 bg-gray-900/50 backdrop-blur-md px-6 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-3">
            <div class="h-10 w-10 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-xl shadow-lg shadow-indigo-500/30">
                S
            </div>
            <span class="font-extrabold text-2xl tracking-tight bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">stocky</span>
        </div>
        <div class="text-xs bg-gray-900 border border-gray-800 px-3 py-1 rounded-full text-indigo-400">
            Engine: Client-side AI Simulation
        </div>
    </nav>

    <main class="flex-grow max-w-7xl w-full mx-auto px-6 py-10">
        <header class="mb-12">
            <h1 class="text-5xl font-black tracking-tight mb-4 bg-gradient-to-r from-white via-gray-300 to-gray-500 bg-clip-text text-transparent">
                Predictive Financial Intelligence.
            </h1>
            <p class="text-lg text-gray-400 max-w-2xl">
                Simulate the trend of assets using historical variations and lightweight client-side linear regression. 
            </p>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2 font-semibold">Select Ticker</label>
                <select id="ticker" class="w-full bg-gray-950 border border-gray-800 rounded-lg px-4 py-3 focus:outline-none focus:border-indigo-500 transition text-gray-300">
                    <option value="AAPL">Apple Inc. (AAPL)</option>
                    <option value="MSFT">Microsoft Corp. (MSFT)</option>
                    <option value="NVDA">NVIDIA Corporation (NVDA)</option>
                </select>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6">
                <label class="block text-xs uppercase tracking-wider text-gray-500 mb-2 font-semibold">AI Sentiment Trend</label>
                <div id="prediction" class="text-2xl font-bold text-green-400 animate-pulse">Analyzing...</div>
            </div>

            <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 flex items-center justify-between">
                <div>
                    <label class="block text-xs uppercase tracking-wider text-gray-500 mb-1 font-semibold">Model Version</label>
                    <div class="text-sm text-gray-400">v1.2 Lightweight Engine</div>
                </div>
                <button onclick="runAnalysis()" class="bg-indigo-600 hover:bg-indigo-500 transition px-5 py-3 rounded-lg text-sm font-semibold shadow-lg shadow-indigo-600/25 cursor-pointer">
                    Run Analysis
                </button>
            </div>
        </div>

        <section class="bg-gray-900 border border-gray-800 rounded-2xl p-6 mb-8 h-[420px]">
            <canvas id="predictionChart"></canvas>
        </section>
    </main>

    <footer class="border-t border-gray-900 text-center py-6 text-sm text-gray-600">
        &copy; 2026 Stocky. Built on GitHub Pages.
    </footer>

    <script>
        let myChart;

        function runAnalysis() {
            const ticker = document.getElementById('ticker').value;
            const ctx = document.getElementById('predictionChart').getContext('2d');

            // Generating simulated predictive time-series data
            const basePrices = { AAPL: 172.5, MSFT: 415.0, NVDA: 850.0 };
            const base = basePrices[ticker] || 100;

            const historicPrices = [
                base - 4.5, base - 3.2, base - 1.8, base - 0.5, base + 1.2, base
            ];

            // Simulated AI Prediction
            const variance = (Math.random() - 0.45) * 10;
            const predictedPrice = (base + variance).toFixed(2);
            
            const fullPrices = [...historicPrices, parseFloat(predictedPrice)];

            const labels = ['Day -5', 'Day -4', 'Day -3', 'Day -2', 'Day -1', 'Current Day', 'AI Prediction +1 Day'];

            if (myChart) myChart.destroy();

            myChart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: `${ticker} AI Trend Prediction`,
                        data: fullPrices,
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99, 102, 241, 0.15)',
                        borderWidth: 3,
                        fill: true,
                        tension: 0.3,
                        pointBackgroundColor: ['#fff', '#fff', '#fff', '#fff', '#fff', '#22d3ee', '#38bdf8']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            ticks: { color: '#9ca3af' }
                        },
                        x: {
                            grid: { color: 'rgba(255, 255, 255, 0.03)' },
                            ticks: { color: '#9ca3af' }
                        }
                    }
                }
            });

            const predictionText = document.getElementById('prediction');
            const direction = parseFloat(predictedPrice) > base ? 'Bullish' : 'Bearish';
            predictionText.innerHTML = `${direction} ($${predictedPrice})`;
            predictionText.className = direction === 'Bullish' ? 'text-2xl font-bold text-green-400' : 'text-2xl font-bold text-red-400';
        }

        runAnalysis();
    </script>
</body>
</html>
